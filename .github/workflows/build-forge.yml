name: Compilar BWE para Forge 1.20.1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exigir fuentes completos
        shell: bash
        run: |
          if [[ ! -f build.gradle || ! -f settings.gradle || ! -f src/main/java/net/barttolo/bwe/BarttoloWorldExpansion.java ]]; then
            echo "::error::Faltan fuentes BWE. Sube el contenido descomprimido del ZIP antes de compilar."
            exit 1
          fi
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Verificaciones estaticas y geometria
        shell: bash
        run: |
          python3 tests/verify_source.py
          python3 tests/verify_toml.py
          python3 tests/test_chunk_guard.py
          python3 tests/verify_simulation_parity.py
          python3 tests/verify_ci.py
          bash tests/run_geometry_tests.sh
      - name: Compilar y reobfuscar Forge 1.20.1
        run: gradle --no-daemon --stacktrace build
      - name: Adjuntar JAR experimental
        uses: actions/upload-artifact@v4
        with:
          name: BarttoloWorldExpansion-Forge-1.20.1-EXPERIMENTAL
          path: build/libs/*.jar
          if-no-files-found: error
