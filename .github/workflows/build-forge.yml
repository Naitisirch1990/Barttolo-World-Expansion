name: Compilar BWE para Forge 1.20.1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Exigir fuentes completos
        shell: bash
        run: |
          if [[ ! -f build.gradle || ! -f settings.gradle || ! -f src/main/java/net/barttolo/bwe/BarttoloWorldExpansion.java ]]; then
            echo "::error::Faltan fuentes BWE. Sube el contenido descomprimido del ZIP antes de compilar."
            exit 1
          fi
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Probar geometria Java sin Minecraft
        run: bash tests/run_geometry_tests.sh
      - name: Verificar fuentes y metadatos
        run: |
          python3 tests/verify_source.py
          python3 tests/verify_toml.py
          python3 tests/test_chunk_guard.py
          python3 tests/verify_simulation_parity.py
          python3 tests/test_live_occupancy_guard.py
          python3 tests/test_simple_workflow.py
          python3 tests/verify_ci.py
          python3 tests/test_strict_undo_codec.py
          python3 tests/test_completion_marker.py
          python3 tests/test_server_lifecycle.py
          python3 tests/test_undo_entity_guard.py
          python3 tests/test_template_command_id.py
          python3 tests/test_command_safety.py
          python3 tests/test_build_diagnostics.py
          python3 tests/test_dynamic_catalog.py
          python3 tests/test_template_footprint_preflight.py
          python3 tests/test_template_site_audit.py
          python3 tests/test_template_surface_survey.py
          python3 tests/verify_no_third_party_assets.py
      - name: Compilar mod
        run: gradle --no-daemon --stacktrace build
      - name: Validar version, integridad y bytecode del JAR
        shell: bash
        run: |
          set -euo pipefail
          jarfile=$(find build/libs -maxdepth 1 -type f -name 'BarttoloWorldExpansion-*.jar' | head -n 1)
          test -n "$jarfile"
          unzip -t "$jarfile" > /dev/null
          unzip -p "$jarfile" META-INF/mods.toml | grep -F 'version="0.7.0"'
          jar tf "$jarfile" | grep -F 'net/barttolo/bwe/BarttoloWorldExpansion.class'
          javap -verbose -classpath "$jarfile" net.barttolo.bwe.BarttoloWorldExpansion | grep -F 'major version: 61'
      - name: Ensayo real Forge - 15 construcciones y restauracion
        run: gradle --no-daemon --stacktrace runGameTestServer
      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: BarttoloWorldExpansion-Forge-1.20.1-v0.7.0
          path: build/libs/*.jar
          if-no-files-found: error

