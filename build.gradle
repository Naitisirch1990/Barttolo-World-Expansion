plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '0.8.0'
group = 'net.barttolo.bwe'
base { archivesName = 'BarttoloWorldExpansion' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        server { workingDirectory project.file('run'); mods { bwe { source sourceSets.main } } }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', System.getProperty('bwe.testNamespaces', 'barttoloworldexpansion')
            mods { barttoloworldexpansion { source sourceSets.main; source sourceSets.gameTest } }
        }
    }
}

repositories { mavenCentral(); maven { url 'https://api.modrinth.com/maven' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
if (System.getProperty('bwe.testNamespaces') == 'bwe_regression') {
    dependencies { runtimeOnly fg.deobf('maven.modrinth:lootr:mWTXC1ZX') }
    minecraft.runs.gameTestServer {
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Minecraft production JAR must be reobfuscated after compilation.
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }

